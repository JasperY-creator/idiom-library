<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地道口语语料库 · 雅思口语随查</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232F5D50'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='18' font-style='italic' fill='%23F5F1E8' text-anchor='middle'%3Ea%3C/text%3E%3C/svg%3E">
<style>
  /* ============ 设计 token ============ */
  :root {
    --bg: #F5F1E8;          /* 暖米纸底 */
    --card: #FFFFFF;
    --ink: #2B2A26;         /* 主文字 */
    --ink-2: #6B6860;       /* 次文字 */
    --ink-3: #9A968C;       /* 弱提示 */
    --line: #E6E0D2;
    --brand: #2F5D50;       /* 墨绿主色 */
    --brand-soft: #E3EDE8;
    --accent: #B84A32;      /* 砖红强调 */

    /* 标签配色 */
    --c-happy-bg: #E8EFD9;  --c-happy-fg: #4A6030;
    --c-annoyed-bg: #F5E0D8; --c-annoyed-fg: #9E3E28;
    --c-social-bg: #DDE6EE; --c-social-fg: #35557A;
    --c-sure-bg: #F0E6CC;   --c-sure-fg: #8A6D2F;

    --radius: 14px;
    --shadow: 0 1px 2px rgba(43,42,38,.04), 0 4px 14px rgba(43,42,38,.06);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  /* ============ 顶部 ============ */
  header { padding: 8px 2px 18px; }
  .brand-row {
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px; font-weight: 700; color: var(--ink);
    letter-spacing: .3px; margin: 0;
  }
  .brand em { color: var(--brand); font-style: italic; }
  .count-pill {
    font-size: 12px; color: var(--ink-2);
    background: var(--card); border: 1px solid var(--line);
    padding: 4px 10px; border-radius: 999px;
  }
  .subtitle {
    margin: 6px 0 0; color: var(--ink-2); font-size: 13px;
  }

  /* ============ 搜索框 ============ */
  .search {
    position: relative; margin: 16px 0 12px;
  }
  .search svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 18px; height: 18px; color: var(--ink-3); pointer-events: none;
  }
  .search input {
    width: 100%;
    height: 46px;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 12px;
    padding: 0 14px 0 42px;
    font-size: 16px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .search input::placeholder { color: var(--ink-3); }
  .search input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(47,93,80,.12);
  }

  /* ============ 标签胶囊 ============ */
  .filters {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 2px 14px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-2);
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s;
    font-family: inherit;
  }
  .chip.active {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  /* ============ 卡片列表 ============ */
  .list { display: flex; flex-direction: column; gap: 12px; }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .15s;
    border: 1px solid transparent;
  }
  .card:active { transform: scale(.995); }
  .card.open { border-color: var(--line); }

  .card-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px;
  }
  .card-main { min-width: 0; flex: 1; }
  .en {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px; font-weight: 700; color: var(--ink);
    line-height: 1.25; letter-spacing: .2px;
  }
  .zh {
    margin-top: 4px; font-size: 14px; color: var(--ink-2);
  }
  .tags {
    margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px;
  }
  .tag {
    font-size: 11px; padding: 3px 9px; border-radius: 999px;
  }
  .tag.happy   { background: var(--c-happy-bg);   color: var(--c-happy-fg); }
  .tag.annoyed { background: var(--c-annoyed-bg); color: var(--c-annoyed-fg); }
  .tag.social  { background: var(--c-social-bg);  color: var(--c-social-fg); }
  .tag.sure    { background: var(--c-sure-bg);    color: var(--c-sure-fg); }

  .chevron {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-2);
    transition: transform .2s;
  }
  .card.open .chevron { transform: rotate(180deg); }
  .chevron svg { width: 14px; height: 14px; }

  /* 展开内容 */
  .detail {
    max-height: 0; overflow: hidden;
    transition: max-height .25s ease;
  }
  .card.open .detail { max-height: 600px; }

  .detail-inner { padding-top: 14px; margin-top: 14px; border-top: 1px dashed var(--line); }

  .label {
    font-size: 11px; color: var(--ink-3); letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .origin {
    font-size: 13.5px; color: var(--ink); line-height: 1.65;
  }
  .examples { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .ex {
    font-size: 13.5px; line-height: 1.55;
    padding-left: 12px; border-left: 2px solid var(--brand-soft);
  }
  .ex .en-line { color: var(--ink); }
  .ex .zh-line { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }

  /* 空态 */
  .empty {
    text-align: center; padding: 60px 20px; color: var(--ink-3);
  }
  .empty .big {
    font-family: Georgia, serif; font-size: 40px; color: var(--line);
    font-style: italic; margin-bottom: 8px;
  }

  /* 底部说明 */
  footer {
    margin-top: 32px; padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-3); line-height: 1.7;
  }

  /* 桌面端微调 */
  @media (min-width: 768px) {
    .wrap { padding: 32px 24px 64px; }
    .brand { font-size: 32px; }
    .en { font-size: 23px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand-row">
      <h1 class="brand">地道口语<em>·</em>语料库</h1>
      <span class="count-pill" id="countPill">已收录 12 条</span>
    </div>
    <p class="subtitle">点卡片看词源和例句 · 按情绪/场景快速筛选</p>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="searchInput" type="search" placeholder="搜英文、中文或情绪，如「开心」「exam」「不爽」" autocomplete="off">
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-cat="all">全部</button>
    <button class="chip" data-cat="happy">开心得意</button>
    <button class="chip" data-cat="annoyed">不爽吐槽</button>
    <button class="chip" data-cat="social">社交应答</button>
    <button class="chip" data-cat="sure">表态把握</button>
  </div>

  <div class="list" id="list"></div>

  <footer>
    语料按「情绪/场景」打标签，方便你在口语考场上想表达某个意思时反查。
    后续新增表达只需在数据数组里加一条，分类和标签自己挑。
  </footer>
</div>

<script>
// ============ 语料数据 ============
const EXPRESSIONS = [
  {
    en: "Ace it",
    zh: "轻松通过、考得很好",
    cat: "happy",
    origin: "ace 本是扑克牌里最大的那张 A。赌场里 ace 就是「王牌、顶尖」，后来动词化，「ace an exam」就像打出王牌一样稳稳拿下。",
    examples: [
      ["She aced her driving test on the first try.", "她驾照考试一把过了。"],
      ["If you've practiced enough, you'll ace the interview.", "练到位了，面试稳的。"]
    ]
  },
  {
    en: "She's salty",
    zh: "她很不爽、在闹脾气",
    cat: "annoyed",
    origin: "最早跟航海有关，「salty」形容饱经风霜的老水手；1930 年代进入美国黑人英语表示「火气大、爱怼人」；2010 年代电竞圈把它发扬光大——调侃输家「在流咸咸的眼泪」，于是专指输不起、酸了。",
    examples: [
      ["Stop being salty just because I beat you.", "不就赢你一把，别这么酸。"],
      ["He got salty when the boss praised someone else.", "老板夸了别人，他脸就挂不住了。"]
    ]
  },
  {
    en: "Have a blast",
    zh: "玩得非常开心",
    cat: "happy",
    origin: "blast 本义是「爆炸、一阵猛烈冲击」。20 世纪中期美国人把一场热烈喧闹、像炸开一样嗨的派对叫 a blast，慢慢泛指痛快尽兴的经历。",
    examples: [
      ["We had a blast hiking in the mountains.", "我们爬山爬得特别爽。"],
      ["The kids had a blast at the amusement park.", "孩子们在游乐园玩疯了。"]
    ]
  },
  {
    en: "I'm home free",
    zh: "我解脱了、没事了",
    cat: "happy",
    origin: "来自老式棋盘游戏和棒球：跑回 home（本垒/终点）就安全了、没人追得上。所以 home free 就是大局已定、后顾之忧全没了。",
    examples: [
      ["Once I finish this presentation, I'm home free.", "讲完这个 PPT 我就彻底解放了。"],
      ["With the other team down to two players, we're home free.", "对方只剩两人，我们稳赢。"]
    ]
  },
  {
    en: "White lie",
    zh: "善意的谎言",
    cat: "social",
    origin: "西方文化里 white 长期象征纯洁、无害（white magic 白魔法 vs. black magic 黑魔法）。18 世纪起把「不带恶意、为了照顾对方情绪而撒的小谎」叫 white lie，和 black lie（恶意谎言）相对。",
    examples: [
      ["I told a white lie and said the dress looked great.", "我撒了个善意的谎，说裙子很好看。"],
      ["\"I'm fine\" is often just a white lie.", "「我没事」经常是句善意的谎言。"]
    ]
  },
  {
    en: "I see red",
    zh: "火冒三丈",
    cat: "annoyed",
    origin: "源自古希腊以来「公牛见红布就怒」的说法（其实公牛是色盲，但文化印象已经固化），再加红色在西方一直和血、愤怒绑定，于是 see red 就是瞬间暴怒。",
    examples: [
      ["I saw red when someone scratched my new car.", "有人划了我的新车，我当场炸了。"],
      ["She saw red reading the nasty comment.", "看到那条恶意评论，她气炸了。"]
    ]
  },
  {
    en: "I'm your man",
    zh: "这事找我就对了",
    cat: "social",
    origin: "20 世纪中期美国口语，字面「我就是你要找的那个人」，主动打包票表示这活儿我最靠谱。现在女生也常用，常说成 I'm your person。",
    examples: [
      ["Need someone to fix the faucet? I'm your man.", "水龙头漏水要修？找我。"],
      ["Want cheap but good food? I'm your man.", "想吃便宜又好吃的？问我准没错。"]
    ]
  },
  {
    en: "Six seven",
    zh: "懂的都懂、没法解释",
    cat: "social",
    origin: "2024 年底才爆火的 Gen Alpha 新梗，出自费城说唱歌手 Skrilla 的歌《Doot Doot (6 7)》，配上 NBA 球员 LaMelo Ball（身高 6 尺 7 寸）的篮球剪辑传遍 TikTok。它本身没有固定含义——「说不通就是它的意思」，用来敷衍、糊弄、表示别问了。",
    examples: [
      ["A: Where did you go last night? B: Six seven.", "A：昨晚去哪了？B：懂的都懂。"],
      ["Don't ask why it works, it's just six seven.", "别问它为啥能成，玄学。"]
    ]
  },
  {
    en: "Ninety-nine",
    zh: "几乎、差不多",
    cat: "sure",
    origin: "来自口语里常用的「ninety-nine percent sure」（99% 确定），故意不说满 100%，给自己留点余地。省略掉 percent 之后直接当形容词用，表八九不离十。",
    examples: [
      ["I'm ninety-nine sure he'll forget.", "我几乎可以肯定他会忘。"],
      ["The plan is ninety-nine ready; just one small thing left.", "计划基本就绪，就差一点。"]
    ]
  },
  {
    en: "You're needy",
    zh: "你很粘人",
    cat: "annoyed",
    origin: "need + -y 形容词后缀本来中性，指「有需要的」。20 世纪中期以后在情感语境里带上贬义——专指那种不停要确认、要陪伴、要安全感的「情感索取型」人。",
    examples: [
      ["He gets really needy if we don't text every day.", "我们要不天天发消息，他就特别粘人。"],
      ["Stop being so needy — she has her own life.", "别那么粘人，人家有自己的生活。"]
    ]
  },
  {
    en: "On cloud nine",
    zh: "非常高兴、飘飘然",
    cat: "happy",
    origin: "最流行的说法是 1896 年国际云图把云分成十类，第 9 号是最高最蓬松的积雨云，所以「待在第九号云上」就是飘在最高最爽的地方；也有人扯到基督教九级天使里最高的炽天使。1950 年代从美国电台/爵士圈流行开来。",
    examples: [
      ["She's been on cloud nine since he proposed.", "他求婚后她一直飘飘然。"],
      ["Winning the award put him on cloud nine.", "拿奖让他爽到不行。"]
    ]
  },
  {
    en: "Ten-four",
    zh: "收到了、明白",
    cat: "social",
    origin: "来自 1930 年代美国警察无线电的「10-code」，10-4 在代码表里就是 message received。1970 年代通过 CB 民用对讲机、卡车司机文化和电影《Smokey and the Bandit》火遍全国，变成口语里俏皮的「得嘞」。",
    examples: [
      ["Ten-four, I'll be there in ten.", "收到，我十分钟到。"],
      ["A: Bring some pizza. B: Ten-four.", "A：带点披萨。B：得嘞。"]
    ]
  }
];

const CAT_LABEL = {
  happy: "开心得意",
  annoyed: "不爽吐槽",
  social: "社交应答",
  sure: "表态把握"
};

// ============ 状态 ============
let currentCat = "all";
let keyword = "";

// ============ 渲染 ============
const listEl = document.getElementById("list");
const countPill = document.getElementById("countPill");

function render() {
  const kw = keyword.trim().toLowerCase();
  const filtered = EXPRESSIONS.filter(item => {
    if (currentCat !== "all" && item.cat !== currentCat) return false;
    if (!kw) return true;
    const hay = (item.en + " " + item.zh + " " + CAT_LABEL[item.cat] + " " + item.origin + " " + item.examples.map(e => e.join(" ")).join(" ")).toLowerCase();
    return hay.includes(kw);
  });

  countPill.textContent = `已收录 ${EXPRESSIONS.length} 条 · 显示 ${filtered.length}`;

  if (filtered.length === 0) {
    listEl.innerHTML = `
      <div class="empty">
        <div class="big">· · ·</div>
        <div>没找到匹配的表达，换个关键词试试？</div>
      </div>`;
    return;
  }

  listEl.innerHTML = filtered.map((item, i) => `
    <div class="card" data-idx="${i}">
      <div class="card-head">
        <div class="card-main">
          <div class="en">${item.en}</div>
          <div class="zh">${item.zh}</div>
          <div class="tags">
            <span class="tag ${item.cat}">${CAT_LABEL[item.cat]}</span>
          </div>
        </div>
        <div class="chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="detail">
        <div class="detail-inner">
          <div class="label">词源 · ORIGIN</div>
          <div class="origin">${item.origin}</div>
          <div class="label" style="margin-top:14px">例句 · EXAMPLES</div>
          <div class="examples">
            ${item.examples.map(ex => `
              <div class="ex">
                <div class="en-line">${ex[0]}</div>
                <div class="zh-line">${ex[1]}</div>
              </div>`).join("")}
          </div>
        </div>
      </div>
    </div>
  `).join("");

  // 绑定卡片展开
  listEl.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => card.classList.toggle("open"));
  });
}

// ============ 事件 ============
document.getElementById("filters").addEventListener("click", (e) => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  btn.classList.add("active");
  currentCat = btn.dataset.cat;
  render();
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  keyword = e.target.value;
  render();
});

render();
</script>
</body>
</html>
