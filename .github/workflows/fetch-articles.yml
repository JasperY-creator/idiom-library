name: Fetch Daily Featured Articles

on:
  schedule:
    # 每两天北京时间早上 8 点跑一次（UTC 0:00，每 2 天）
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install feedparser
      - name: Fetch and generate featured articles
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/fetch_featured.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add featured.json
          git diff --staged --quiet || git commit -m "chore: auto-update featured.json [$(date -u '+%Y-%m-%d')]"
          git push
